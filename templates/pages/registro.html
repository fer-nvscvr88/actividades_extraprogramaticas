<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Colegio San Lorenzo</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="pagina-acceso">

    <main class="tarjeta-acceso">
        <h1>🏫 Colegio San Lorenzo</h1>
        <h2>Registro de estudiante</h2>

        {% with mensajes = get_flashed_messages() %}
            {% for mensaje in mensajes %}
                <p class="mensaje">{{ mensaje }}</p>
            {% endfor %}
        {% endwith %}

        <form method="POST" action="{{ url_for('main.registro') }}">

            <label>Nombre</label>
            <input type="text" name="nombre" required>

            <label>Apellido</label>
            <input type="text" name="apellido" required>

            <label>RUT</label>
            <input type="text" name="rut" placeholder="12.345.678-9" required>

            <label>Correo</label>
            <input type="email" name="correo" required>

            <label>Curso</label>
            <select name="curso" required>
                <option value="">Selecciona tu curso</option>
                <option>7° Básico</option>
                <option>8° Básico</option>
                <option>1° Medio</option>
                <option>2° Medio</option>
                <option>3° Medio</option>
                <option>4° Medio</option>
            </select>

            <label>Contraseña</label>
            <input type="password" name="contrasena" required>

            <button type="submit">Registrarme</button>
        </form>

        <p>¿Ya tienes cuenta?
            <a href="{{ url_for('main.login') }}">Inicia sesión</a>
        </p>

    </main>

</body>
</html>
